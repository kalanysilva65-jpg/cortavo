# Config do Nginx — termina o SSL e encaminha TUDO (domínio raiz + qualquer
# subdomínio) para o app Node na porta 3000. É isto que resolve "subdomínio
# por barbearia": criar uma barbearia com slug novo no painel-mestre já
# funciona em <slug>.cortavo.com.br sem tocar em Nginx/DNS de novo, porque
# o bloco abaixo aceita QUALQUER subdomínio (server_name com wildcard) — quem
# decide se o slug existe é o app (middlewares/tenant.js), não o servidor web.
#
# INSTALAÇÃO:
#   1. sudo cp nginx-cortavo.conf /etc/nginx/sites-available/cortavo
#   2. sudo ln -s /etc/nginx/sites-available/cortavo /etc/nginx/sites-enabled/
#   3. Rode certbot (veja deploy/README.md) ANTES de ativar os blocos 443 —
#      os caminhos de certificado abaixo só existem depois do certbot rodar.
#   4. sudo nginx -t && sudo systemctl reload nginx

# Redireciona todo HTTP (raiz e qualquer subdomínio) para HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name cortavo.com.br *.cortavo.com.br;

    # O certbot com plugin DNS-01 usa este local para o desafio HTTP-01 de
    # fallback em alguns fluxos; manter liberado não tem custo.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # O wildcard cobre QUALQUER slug: barbeariaandrade.cortavo.com.br,
    # barbeariax.cortavo.com.br, etc. — todos caem aqui.
    server_name cortavo.com.br *.cortavo.com.br;

    # Preenchidos pelo certbot (modo DNS-01 — veja deploy/README.md). Só
    # existem DEPOIS de rodar o certbot; não ative este server{} antes disso.
    ssl_certificate     /etc/letsencrypt/live/cortavo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cortavo.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    # Uploads de foto podem passar de 1 MB (o padrão do Nginx).
    client_max_body_size 10m;

    # Link de "Crie sua senha" (spec 13): a URL leva o token (?t=...), válido
    # por até 72 h. Achado M2 do Sergio: SEM log de acesso nesta rota, para o
    # token não ficar gravado em /var/log/nginx nem nos backups de log. O app
    # já troca a URL por /criar-senha limpa no primeiro GET.
    location = /criar-senha {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Preserva o Host original — é DELE que src/middlewares/tenant.js
        # extrai o slug (req.hostname). Sem isto todo subdomínio cairia como
        # se fosse o domínio raiz.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Necessário se o app usar WebSocket em algum momento; inofensivo hoje.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
